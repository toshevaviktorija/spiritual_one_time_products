{% extends 'admin/base_site.html' %}{% load static %}
{% block extrastyle %}{{ block.super }}<link rel="stylesheet" href="{% url 'palette' %}"><style>
.chart-workflow{max-width:1000px;margin:25px auto;padding:32px;border:1px solid transparent;border-radius:18px;background:linear-gradient(135deg,#100820,#28183E) padding-box,var(--panel-border-gradient) border-box;color:#F4E8DD;box-shadow:0 10px 40px #10082033;}
.chart-workflow h1,.chart-workflow h2{color:#FFF0C7;font-family:Georgia,serif}.chart-workflow a{color:#F2D49A}.chart-workflow form p{margin:20px 0}.chart-workflow label{display:block;margin:0 0 8px;color:#D8C5E6}.chart-workflow input:not([type=checkbox]),.chart-workflow textarea,.chart-workflow select{width:100%;box-sizing:border-box;background:#100820;color:#F4E8DD;border:1px solid #6F477A;border-radius:10px;padding:12px}.chart-workflow button,.chart-workflow .action{display:inline-block;padding:12px 20px;border:1px solid #D9AA68;border-radius:10px;background:#34204D;color:#FFF0C7;cursor:pointer;margin:8px 8px 8px 0}.chart-workflow button:disabled{opacity:.45;cursor:not-allowed}.email-preview{width:100%;height:780px;border:1px solid #755426;border-radius:16px;background:#100820}.chart-workflow .errorlist{color:#ffb4bf}.chart-workflow .helptext{color:#C5B2C8}
</style>{% endblock %}
{% block content %}<section class="chart-workflow">{% block workflow %}{% endblock %}</section>{% endblock %}
